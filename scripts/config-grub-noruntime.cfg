# EVE CONFIG-partition GRUB override: skip U-Boot UEFI ResetSystem.
#
# Linux machine_restart() calls efi_reboot() before the restart-notifier
# chain. On N1-655, U-Boot's ResetSystem is a disabled PSCI stub that
# then while (1). efi=noruntime leaves EFI_RUNTIME_SERVICES unset so
# do_kernel_restart() reaches ambarella-reboot (RCT 0x68 mask 0x3).
#
# Copy to the node's CONFIG partition (survives BaseOS OTA, not a reinstall):
#
#   scp scripts/config-grub-noruntime.cfg n1-655-devkit:/config/grub.cfg
#   scp scripts/config-grub-noruntime.cfg n1-655-pro:/config/grub.cfg
#
# If /config/grub.cfg already exists, append the set_global line instead of
# overwriting (devkit currently sets eve_install_disk and set_getty).
#
# On a running EVE debug shell, /config is a tmpfs. Persist by mounting the
# CONFIG GPT partition (mmcblk0p4), editing grub.cfg there, then umount:
#   mkdir -p /tmp/cfgmnt && mount /dev/mmcblk0p4 /tmp/cfgmnt
#   ...edit /tmp/cfgmnt/grub.cfg...
#   umount /tmp/cfgmnt
#
# GRUB sources ($config_part)/grub.cfg after platform defaults. Activate
# with one MCU cold cycle (pwr off -y / pwr on); Linux reboot still hangs
# on the current boot. See automation/doc/Issues.md Issue 1.
#
# Permanent image copy lives in eve/pkg/grub/rootfs.cfg (Ambarella block).

set_global dom0_extra_args "$dom0_extra_args efi=noruntime"
